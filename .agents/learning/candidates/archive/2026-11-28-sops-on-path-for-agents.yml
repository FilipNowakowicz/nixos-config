observation: "`sops` is not on PATH in agent shells. Agents running B2 audits or secret inspection hit `command not found: sops` in three sessions. In one the user said \"i'm missing sops on PATH\"."
proposed_upgrade: "Add `sops` to the main user's packages or to the dev shell. Add an invariant or home-profile check that `sops`, `jq` and `statix` are present. Otherwise provide a `scripts/with-sops.sh` wrapper that runs `nix shell nixpkgs#sops`."
evidence: ["claude 570a7e006296: `(eval):2: command not found: sops`","claude 4b0ad6b2ab9f: `b2audit.sh: line 6: sops: command not found`","codex 198aa41e22fd: `zsh:2: command not found: sops`","claude 81d71311d6c0 user: \"i'm missing sops on PATH\""]
