resolved: 2026-11-28
resolution: "Already handled. PR #651 (b5a406b, 2026-11-28) added the CLAUDE.md note 'Bare agent shells lack repo tooling (sops, statix, …): run repo scripts as nix develop -c <cmd>, one-off tools as nix shell nixpkgs#<pkg>', and flake/dev.nix already puts sops in the dev shell. The cited failures happened before that note existed."
