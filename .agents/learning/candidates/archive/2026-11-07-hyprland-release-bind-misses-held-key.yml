observation: Hyprland 0.57 never fires a SUPER release bind (any of transparent/ignore_mods/non_consuming) when SUPER comes up while another key is still held; hl.on("input.keyboard.key", fn(keycode_xkb, time_ms, state)) does see it. A layer shell without keyboard focus also gets its toplevel activate ignored, so focus via hl.dsp.focus. tests/quiet-shell/nested.sh fakes setsid, so launch test windows without it.
proposed_upgrade: add these three gotchas to tests/quiet-shell/README.md or packages/quiet-shell/shell/README.md; key-order probes via chord.py proved each
