observation: The "Deploy homeserver-gcp" workflow's validate step (deploy-rs cross-host activation check) builds every host's closure, not just homeserver-gcp's; a break confined to an unrelated host (mac's moonlight-qt, nixpkgs ffmpeg 9.0 dropping AVCodec.pix_fmts) failed that check and looked like a homeserver-gcp deploy problem after the weekly flake-lock bump (PR #394), even though merge-gate on #394 itself passed clean.
proposed_upgrade: Add a note to docs/operations.md or hosts/homeserver-gcp/CLAUDE.md that a "Deploy homeserver-gcp" CI failure after a flake.lock bump can originate from any host's closure — read the failing derivation name in the run log before assuming it is homeserver-gcp-specific.

