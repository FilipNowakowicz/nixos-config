observation: Removing a row from a README markdown table changes prettier's column widths; both PRs reported documentation checks and Nix formatting passing, but the lint job's treefmt --fail-on-change failed on README.md, blocking merge-gate. Parallel PRs reflowing the same table then conflict.
proposed_upgrade: Run the lint job's `nix fmt -- --fail-on-change` inside `validate.sh docs`, so the documented docs check catches Markdown reflow before push.
