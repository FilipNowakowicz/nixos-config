resolution: "Not documented yet (649a880 is an unrelated AdGuard exclusion). I checked that nixpkgs' binary is backblaze-b2 and added a short read-only size recipe to docs/backups.md, with the note that the caps are only shown in the console. I skipped the proposed per-host script because it would need sops decryption in a script for a rare audit."
