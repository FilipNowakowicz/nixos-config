schema: learning-candidate/v1
id: 2026-11-23-hardened-unit-path-under-foreign-statedirectory
date: 2026-11-23
expires: 2027-02-23
status: open
route: implement-fix
best_form: test
evidence: [pr-#585, homeserver-gcp journal 2026-11-23 04:15 "install: cannot stat '/var/lib/nginx/certs/homeserver-gcp.crt': Permission denied", nixpkgs 0bb8272 nginx StateDirectory=nginx mode 0700]
observation: nixpkgs bump added StateDirectory=nginx (0700); systemd re-owned /var/lib/nginx/certs to nginx, so hardened root tailscale-cert (no CAP_DAC_OVERRIDE) failed, nginx Requires= failed, deploy rolled back with nginx stopped; smoke test missed it because its stub cert generator runs unhardened
proposed_upgrade: add a flake check that no hardened unit's ReadWritePaths or tmpfiles dir sits under another unit's StateDirectory/CacheDirectory/LogsDirectory, and/or make homeserver-gcp-smoke run the real tailscale-cert copy step under its hardening
type: repo-fix
dedupe_key: hardening:path-under-foreign-statedirectory
targets: [flake/checks.nix, tests/nixos/homeserver-gcp-smoke.nix]
