
source = ~/.config/hypr/hyprlock-colors.conf

auth {
  fingerprint:enabled = true
}

general {
  hide_cursor = true
}

# One soft fade in, a quicker one out on unlock. 1 = 100 ms.
animations {
  enabled   = true
  bezier    = settle, 0.2, 0.8, 0.2, 1
  animation = fadeIn, 1, 4, settle
  animation = fadeOut, 1, 2, settle
}

background {
  monitor =
  path        = ~/.local/share/wallpapers/current.png
  blur_passes = 3
  blur_size   = 10
  brightness  = 0.55
  vibrancy    = 0.17
}

# Date, small and above the clock, the way macOS does it
label {
  monitor     =
  text        = cmd[update:60000] echo "<span font_weight='600'>$(date '+%A %-d %B')</span>"
  color       = $glass
  font_size   = 22
  font_family = Inter Display
  halign      = center
  valign      = center
  position    = 0, 240
}

# Clock: heavy, tightly spaced, slightly see-through so the wallpaper tints it
label {
  monitor     =
  text        = <span font_weight="700" letter_spacing="-4800">$TIME</span>
  color       = $glass
  font_size   = 136
  font_family = Inter Display
  halign      = center
  valign      = center
  position    = 0, 130
}

# Battery
label {
  monitor     =
  text        = cmd[update:30000] ~/.config/hypr/lock-status battery
  color       = $text
  font_size   = 13
  font_family = Inter Display
  halign      = right
  valign      = top
  position    = -28, -20
}

# Password input
input-field {
  monitor           =
  size              = 260, 42
  rounding          = -1
  outline_thickness = 1
  dots_size         = 0.22
  dots_spacing      = 0.35
  outer_color       = $edge
  inner_color       = $field
  font_color        = $text
  font_family       = Inter Display
  fade_on_empty     = true
  fade_timeout      = 3000
  placeholder_text  = Touch sensor or type password
  check_color       = $amber
  fail_color        = $fail
  capslock_color    = $orange
  fail_text         = $FAIL ($ATTEMPTS)
  halign            = center
  valign            = bottom
  position          = 0, 96
}
