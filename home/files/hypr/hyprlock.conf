
source = ~/.config/hypr/hyprlock-colors.conf

auth {
  fingerprint:enabled = true
}

general {
  hide_cursor = true
}

background {
  monitor =
  path        = ~/.local/share/wallpapers/current.png
  blur_passes = 3
  blur_size   = 10
  brightness  = 0.55
  vibrancy    = 0.17
}

# Date
label {
  monitor     =
  text        = cmd[update:60000] date '+%A, %-d %B'
  color       = $text
  font_size   = 20
  font_family = Inter Display
  halign      = center
  valign      = top
  position    = 0, -96
}

# Clock
label {
  monitor     =
  text        = <span font_weight="300">$TIME</span>
  color       = $text
  font_size   = 112
  font_family = Inter Display
  halign      = center
  valign      = top
  position    = 0, -128
}

# Battery
label {
  monitor     =
  text        = cmd[update:30000] ~/.config/hypr/lock-status battery
  color       = $text
  font_size   = 13
  font_family = Inter Display
  halign      = right
  valign      = top
  position    = -28, -20
}

# Now playing
label {
  monitor     =
  text        = cmd[update:3000] ~/.config/hypr/lock-status media
  color       = $text
  font_size   = 14
  font_family = Inter Display
  halign      = center
  valign      = bottom
  position    = 0, 44
}

# Password input
input-field {
  monitor           =
  size              = 260, 42
  rounding          = -1
  outline_thickness = 1
  dots_size         = 0.22
  dots_spacing      = 0.35
  outer_color       = rgba(255, 255, 255, 0.18)
  inner_color       = rgba(0, 0, 0, 0.35)
  font_color        = $text
  font_family       = Inter Display
  fade_on_empty     = false
  placeholder_text  = Password
  check_color       = $amber
  fail_color        = rgb(cc241d)
  fail_text         = $FAIL ($ATTEMPTS)
  halign            = center
  valign            = bottom
  position          = 0, 96
}
