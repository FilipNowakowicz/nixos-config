# BEGIN_KITTY_THEME
# Gruvbox Warm
# generated by home-manager from home/theme/active.nix
include current-theme.conf
# END_KITTY_THEME

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        12.0

background_opacity 0.85

# Hyprland tiles every window, so a saved size/state only fights the layout:
# with this on, closing a maximized kitty makes every later kitty launch maximized.
remember_window_size no

close_on_child_death yes
confirm_os_window_close 0
# Each kitty listens on its own socket in the runtime directory, which only this
# user can reach, so the quiet shell (and agents) can find the window running a
# process and type into it, read it or focus it with `kitty @ --to unix:...`.
# socket-only: a program printing escape codes into a terminal can no longer
# drive kitty, which plain `yes` allowed. Processes inside kitty find their own
# socket in $KITTY_LISTEN_ON.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}
paste_protection false
