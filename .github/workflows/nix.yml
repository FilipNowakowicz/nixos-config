name: Nix flake check

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: nix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# An explicit shell adds pipefail, so a failing command piped into tee fails the step.
defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  push-policy:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - id: decide
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            if (context.eventName !== "push") {
              core.setOutput("should_run", "true");
              core.setOutput("reason", `non-push event: ${context.eventName}`);
              return;
            }

            const { owner, repo } = context.repo;
            const commitSha = context.sha;
            const pulls = await github.request(
              "GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls",
              {
                owner,
                repo,
                commit_sha: commitSha,
                mediaType: { previews: ["groot"] },
              },
            );

            if (pulls.data.length > 0) {
              const numbers = pulls.data.map((pr) => `#${pr.number}`).join(", ");
              core.info(`Skipping push-triggered CI for ${commitSha}; associated PRs: ${numbers}`);
              core.setOutput("should_run", "false");
              core.setOutput("reason", `push commit is associated with PR(s): ${numbers}`);
              return;
            }

            core.info(`Running push-triggered CI for direct push ${commitSha}`);
            core.setOutput("should_run", "true");
            core.setOutput("reason", "direct push to main");

  changes:
    needs: push-policy
    if: needs.push-policy.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.plan.outputs.docs_only }}
      run_eval: ${{ steps.plan.outputs.run_eval }}
      run_lint: ${{ steps.plan.outputs.run_lint }}
      run_light: ${{ steps.plan.outputs.run_light }}
      run_packages: ${{ steps.plan.outputs.run_packages }}
      hosts: ${{ steps.plan.outputs.hosts }}
      hosts_matrix: ${{ steps.plan.outputs.hosts_matrix }}
      tests: ${{ steps.plan.outputs.tests }}
      tests_matrix: ${{ steps.plan.outputs.tests_matrix }}
      closure: ${{ steps.plan.outputs.closure }}
      closure_main: ${{ steps.plan.outputs.closure_main }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_CHANGED_FILES: docs/remote-builder.md
        run: bash scripts/ci-plan.sh

      - name: Validate planner coverage
        run: bash scripts/test-ci-plan.sh

      - name: Validate builder dispatch and merge-gate contracts
        run: bash scripts/test-ci-builder.sh

      - name: Validate cache config consistency
        run: bash scripts/check-cache-config.sh

      - name: Validate CI build-job safeguards
        run: bash scripts/check-ci-build-safeguards.sh

  builder:
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !contains(github.event.pull_request.labels.*.name, 'skip-builder')
      && (needs.changes.outputs.run_light == 'true'
          || needs.changes.outputs.run_packages == 'true'
          || needs.changes.outputs.hosts == 'true'
          || needs.changes.outputs.tests == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      available: ${{ steps.probe.outputs.available || 'false' }}
      completed: ${{ steps.checks.outputs.completed || 'false' }}
    env:
      # tag:ci-builder cannot query the tailnet DNS resolver.
      BUILDER_FQDN: 100.106.144.121
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        continue-on-error: true
        with:
          credentials_json: ${{ secrets.BUILDER_CI_GCP_KEY }}

      - id: gcloud
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        continue-on-error: true

      - id: tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        continue-on-error: true
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-builder
          args: --accept-dns=false
          hostname: ci-builder-${{ github.run_id }}-${{ github.run_attempt }}
          retry: "2"
          log-mode: quiet

      - name: Start builder and probe SSH
        id: probe
        env:
          BUILDER_CI_SSH_KEY: ${{ secrets.BUILDER_CI_SSH_KEY }}
          CLOUD_OUTCOME: ${{ steps.gcloud.outcome }}
          TAILNET_OUTCOME: ${{ steps.tailnet.outcome }}
        run: |
          export BUILDER_SSH_KEY="$RUNNER_TEMP/builder-ci-key"
          echo "BUILDER_SSH_KEY=$BUILDER_SSH_KEY" >> "$GITHUB_ENV"
          umask 077
          printf '%s\n' "$BUILDER_CI_SSH_KEY" > "$BUILDER_SSH_KEY"
          source scripts/lib/builder.sh
          if [[ "$CLOUD_OUTCOME" == success && "$TAILNET_OUTCOME" == success ]] && start_builder; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Builder unavailable before checks; using GitHub-hosted fallback jobs.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Run planned checks on builder
        id: checks
        if: steps.probe.outputs.available == 'true'
        env:
          BUILDER_READY: "1"
          PLAN_LIGHT: ${{ needs.changes.outputs.run_light }}
          PLAN_PACKAGES: ${{ needs.changes.outputs.run_packages }}
          PLAN_HOSTS: ${{ needs.changes.outputs.hosts }}
          PLAN_TESTS: ${{ needs.changes.outputs.tests }}
          PLAN_HOSTS_MATRIX: ${{ needs.changes.outputs.hosts_matrix }}
          PLAN_TESTS_MATRIX: ${{ needs.changes.outputs.tests_matrix }}
        run: |
          bash scripts/on-builder.sh env \
            "PLAN_LIGHT=$PLAN_LIGHT" "PLAN_PACKAGES=$PLAN_PACKAGES" \
            "PLAN_HOSTS=$PLAN_HOSTS" "PLAN_TESTS=$PLAN_TESTS" \
            "PLAN_HOSTS_MATRIX=$PLAN_HOSTS_MATRIX" "PLAN_TESTS_MATRIX=$PLAN_TESTS_MATRIX" \
            nix shell --inputs-from . nixpkgs#git nixpkgs#jq -c bash scripts/ci-builder-checks.sh
          echo 'completed=true' >> "$GITHUB_OUTPUT"

      - name: Remove temporary SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/builder-ci-key"

  eval:
    needs: [push-policy, changes]
    if: needs.changes.outputs.run_eval == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-nix
        with:
          enable-eval-cache: "true"

      - name: Flake evaluation
        run: bash scripts/validate.sh flake-eval

  checks-light:
    needs: [push-policy, changes, builder]
    if: >-
      always() && needs.changes.result == 'success'
      && needs.changes.outputs.run_light == 'true'
      && (needs.builder.result == 'skipped'
          || (needs.builder.result == 'success' && needs.builder.outputs.available == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - id: setup-nix
        uses: ./.github/actions/setup-nix
        with:
          enable-eval-cache: "true"
          enable-store-cache: "true"
          cache-key-suffix: checks-light
          store-cache-size-gb: "2"

      - name: Build lightweight blocking checks
        env:
          PATHS_FILE: ${{ runner.temp }}/checks-light-paths.txt
        run: |
          rm -f "$PATHS_FILE"
          PRINT_PATHS=1 bash scripts/validate.sh light | tee "$PATHS_FILE" >/dev/null

      - name: Push to cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          PATHS_FILE: ${{ runner.temp }}/checks-light-paths.txt
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CACHE_SIGNING_KEY: ${{ secrets.CACHE_SIGNING_KEY }}
        run: bash scripts/push-to-r2.sh

      - name: Save Nix store cache
        if: success() && steps.setup-nix.outputs.store-cache-enabled == 'true'
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: ${{ steps.setup-nix.outputs.store-cache-primary-key }}
          gc-max-store-size-linux: "2G"
          purge: true
          purge-prefixes: nix-${{ runner.os }}-checks-light-
          purge-created: 0
          purge-last-accessed: 604800
          purge-primary-key: never

      - name: Summarize Nix store cache
        if: success() && steps.setup-nix.outputs.store-cache-enabled == 'true'
        env:
          CACHE_LABEL: ${{ steps.setup-nix.outputs.store-cache-label }}
          CACHE_HIT: ${{ steps.setup-nix.outputs.store-cache-hit }}
          RESTORED_BYTES: ${{ steps.setup-nix.outputs.store-cache-restored-bytes }}
        run: bash scripts/write-cache-summary.sh "$CACHE_LABEL" "$RESTORED_BYTES" "$CACHE_HIT"

  lint:
    needs: [push-policy, changes]
    if: needs.changes.outputs.run_lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-nix

      - name: Lint (statix)
        run: nix run .#statix -- check .

      - name: Dead code (deadnix)
        run: nix run .#deadnix -- --fail .

      - name: Format check (treefmt)
        run: nix fmt -- --fail-on-change

      - name: Lint shell (shellcheck)
        run: |
          mapfile -t shell_scripts < <(find . -type f -name '*.sh' -not -path './.git/*')
          if [ "${#shell_scripts[@]}" -eq 0 ]; then
            exit 0
          fi
          nix run .#shellcheck -- "${shell_scripts[@]}"

      - name: Scan for plaintext secrets
        run: bash scripts/scan-plaintext-secrets.sh

      - name: Check Markdown links
        run: bash scripts/validate.sh docs

      - name: Lint GitHub Actions (actionlint)
        run: nix run nixpkgs#actionlint

  packages:
    needs: [push-policy, changes, builder]
    if: >-
      always() && needs.changes.result == 'success'
      && needs.changes.outputs.run_packages == 'true'
      && (needs.builder.result == 'skipped'
          || (needs.builder.result == 'success' && needs.builder.outputs.available == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true

      - uses: ./.github/actions/setup-nix

      - name: Build package outputs
        env:
          PATHS_FILE: ${{ runner.temp }}/package-paths.txt
        run: |
          rm -f "$PATHS_FILE"
          PRINT_PATHS=1 bash scripts/validate.sh package all | tee "$PATHS_FILE" >/dev/null

      - name: Push package outputs to cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          PATHS_FILE: ${{ runner.temp }}/package-paths.txt
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CACHE_SIGNING_KEY: ${{ secrets.CACHE_SIGNING_KEY }}
        run: bash scripts/push-to-r2.sh

  hosts:
    needs: [push-policy, changes, builder]
    if: >-
      always() && needs.changes.result == 'success'
      && needs.changes.outputs.hosts == 'true'
      && (needs.builder.result == 'skipped'
          || (needs.builder.result == 'success' && needs.builder.outputs.available == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.hosts_matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true

      - id: setup-nix
        uses: ./.github/actions/setup-nix
        with:
          enable-eval-cache: "true"
          enable-store-cache: "true"
          cache-key-suffix: hosts-${{ matrix.name }}
          store-cache-size-gb: "5"

      - name: Build ${{ matrix.name }}
        env:
          HOST: ${{ matrix.name }}
          PATHS_FILE: ${{ runner.temp }}/${{ matrix.name }}-paths.txt
        run: |
          rm -f "$PATHS_FILE"
          PRINT_PATHS=1 bash scripts/validate.sh host "$HOST" | tee "$PATHS_FILE" >/dev/null

      - name: Push ${{ matrix.name }} to cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          HOST: ${{ matrix.name }}
          PATHS_FILE: ${{ runner.temp }}/${{ matrix.name }}-paths.txt
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CACHE_SIGNING_KEY: ${{ secrets.CACHE_SIGNING_KEY }}
        run: bash scripts/push-to-r2.sh

      # Prime R2 with the full prod `main` closure (incremental over main-ci)
      # so future PR closure-diff jobs can fetch the base SHA from cache
      # instead of rebuilding it from scratch.
      - name: Push full main closure to R2 (warms closure-diff base)
        if: |
          success()
          && matrix.name == 'main-ci'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          PATHS_FILE: ${{ runner.temp }}/main-paths.txt
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CACHE_SIGNING_KEY: ${{ secrets.CACHE_SIGNING_KEY }}
        run: |
          rm -f "$PATHS_FILE"
          PRINT_PATHS=1 bash scripts/validate.sh host main | tee "$PATHS_FILE" >/dev/null
          bash scripts/push-to-r2.sh

      - name: Save Nix store cache
        if: success() && steps.setup-nix.outputs.store-cache-enabled == 'true'
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: ${{ steps.setup-nix.outputs.store-cache-primary-key }}
          gc-max-store-size-linux: "5G"
          purge: true
          purge-prefixes: nix-${{ runner.os }}-hosts-${{ matrix.name }}-
          purge-created: 0
          purge-last-accessed: 604800
          purge-primary-key: never

      - name: Summarize Nix store cache
        if: success() && steps.setup-nix.outputs.store-cache-enabled == 'true'
        env:
          CACHE_LABEL: ${{ steps.setup-nix.outputs.store-cache-label }}
          CACHE_HIT: ${{ steps.setup-nix.outputs.store-cache-hit }}
          RESTORED_BYTES: ${{ steps.setup-nix.outputs.store-cache-restored-bytes }}
        run: bash scripts/write-cache-summary.sh "$CACHE_LABEL" "$RESTORED_BYTES" "$CACHE_HIT"

  tests:
    needs: [push-policy, changes, builder]
    if: >-
      always() && needs.changes.result == 'success'
      && needs.changes.outputs.tests == 'true'
      && (needs.builder.result == 'skipped'
          || (needs.builder.result == 'success' && needs.builder.outputs.available == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.tests_matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true

      - id: setup-nix
        uses: ./.github/actions/setup-nix
        with:
          enable-eval-cache: "true"
          enable-store-cache: "true"
          cache-key-suffix: tests-${{ matrix.name }}
          store-cache-size-gb: "3"
          extra-nix-config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Build ${{ matrix.name }}
        env:
          CMD: ${{ matrix.command }}
          TARGET: ${{ matrix.target }}
          PATHS_FILE: ${{ runner.temp }}/${{ matrix.name }}-paths.txt
        run: |
          rm -f "$PATHS_FILE"
          PRINT_PATHS=1 bash scripts/validate.sh "$CMD" "$TARGET" | tee "$PATHS_FILE" >/dev/null

      - name: Push ${{ matrix.name }} to cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          CMD: ${{ matrix.command }}
          TARGET: ${{ matrix.target }}
          PATHS_FILE: ${{ runner.temp }}/${{ matrix.name }}-paths.txt
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CACHE_SIGNING_KEY: ${{ secrets.CACHE_SIGNING_KEY }}
        run: bash scripts/push-to-r2.sh

      - name: Save Nix store cache
        if: success() && steps.setup-nix.outputs.store-cache-enabled == 'true'
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: ${{ steps.setup-nix.outputs.store-cache-primary-key }}
          gc-max-store-size-linux: "3G"
          purge: true
          purge-prefixes: nix-${{ runner.os }}-tests-${{ matrix.name }}-
          purge-created: 0
          purge-last-accessed: 604800
          purge-primary-key: never

      - name: Summarize Nix store cache
        if: success() && steps.setup-nix.outputs.store-cache-enabled == 'true'
        env:
          CACHE_LABEL: ${{ steps.setup-nix.outputs.store-cache-label }}
          CACHE_HIT: ${{ steps.setup-nix.outputs.store-cache-hit }}
          RESTORED_BYTES: ${{ steps.setup-nix.outputs.store-cache-restored-bytes }}
        run: bash scripts/write-cache-summary.sh "$CACHE_LABEL" "$RESTORED_BYTES" "$CACHE_HIT"

  closure-diff:
    if: |
      github.event_name == 'pull_request'
      && needs.changes.outputs.closure == 'true'
      && (needs.hosts.result == 'success' || needs.hosts.result == 'skipped')
    needs: [push-policy, changes, hosts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      summary: ${{ steps.diff.outputs.summary }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - id: setup-nix
        uses: ./.github/actions/setup-nix
        with:
          enable-eval-cache: "true"
          enable-store-cache: "true"
          cache-key-suffix: closure-main

      - name: Compute closure diffs
        id: diff
        env:
          DIFF_MAIN: ${{ needs.changes.outputs.closure_main }}
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          TARGET_REF="HEAD"

          {
            echo "<!-- closure-diff-report -->"
            echo "# Closure Size Report"
            echo

            if [[ "$DIFF_MAIN" == "true" ]]; then
              bash scripts/closure-diff.sh "$BASE_REF" "$TARGET_REF" "main" || echo "Failed to diff main"
            fi
          } > /tmp/closure-summary.md

          {
            echo "summary<<EOF"
            cat /tmp/closure-summary.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  closure-diff-comment:
    if: |
      always()
      && github.event_name == 'pull_request'
      && needs.changes.outputs.closure == 'true'
      && (needs.hosts.result == 'success' || needs.hosts.result == 'skipped')
    needs: [changes, hosts, closure-diff]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Upsert closure diff comment
        env:
          SUMMARY: ${{ needs.closure-diff.outputs.summary }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body =
              process.env.SUMMARY ||
              "<!-- closure-diff-report -->\nClosure diff computation skipped or failed.";
            const marker = "<!-- closure-diff-report -->";

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });

              const existing = comments.find(
                (comment) =>
                  comment.user?.type === "Bot" && comment.body?.includes(marker),
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                return;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            } catch (error) {
              core.warning(`Unable to upsert closure diff comment: ${error.message}`);
            }

  merge-gate:
    needs:
      - push-policy
      - changes
      - builder
      - eval
      - checks-light
      - lint
      - packages
      - hosts
      - tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Verify all required checks passed
        env:
          RESULT_PUSH_POLICY: ${{ needs.push-policy.result }}
          POLICY_SHOULD_RUN: ${{ needs.push-policy.outputs.should_run }}
          POLICY_REASON: ${{ needs.push-policy.outputs.reason }}
          RESULT_CHANGES: ${{ needs.changes.result }}
          RESULT_BUILDER: ${{ needs.builder.result }}
          BUILDER_AVAILABLE: ${{ needs.builder.outputs.available }}
          BUILDER_COMPLETED: ${{ needs.builder.outputs.completed }}
          RESULT_EVAL: ${{ needs.eval.result }}
          RESULT_CHECKS_LIGHT: ${{ needs.checks-light.result }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_PACKAGES: ${{ needs.packages.result }}
          RESULT_HOSTS: ${{ needs.hosts.result }}
          RESULT_TESTS: ${{ needs.tests.result }}
          PLAN_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          PLAN_EVAL: ${{ needs.changes.outputs.run_eval }}
          PLAN_LINT: ${{ needs.changes.outputs.run_lint }}
          PLAN_LIGHT: ${{ needs.changes.outputs.run_light }}
          PLAN_PACKAGES: ${{ needs.changes.outputs.run_packages }}
          PLAN_HOSTS: ${{ needs.changes.outputs.hosts }}
          PLAN_TESTS: ${{ needs.changes.outputs.tests }}
        run: bash scripts/ci-merge-gate.sh
