name: Deploy homeserver-gcp

# Keep disabled in GitHub until review, secret provisioning and a successful manual run.
on:
  push:
    branches: [main]
    paths:
      - hosts/homeserver-gcp/**
      - modules/**
      - lib/**
      - home/**
      - flake.nix
      - flake.lock
      - flake/**
      - scripts/**
      - .github/workflows/deploy-homeserver.yml
      - .github/actions/setup-nix/**
  workflow_dispatch:
    inputs:
      confirm_target:
        description: Type homeserver-gcp to deploy the homeserver
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: deploy-homeserver-gcp
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  builder:
    if: >-
      github.repository == 'FilipNowakowicz/nixos-config'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || inputs.confirm_target == 'homeserver-gcp')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUILDER_FQDN: 100.106.144.121
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Require PR merge-gate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: await require('./scripts/check-deploy-merge-gate.cjs')({github, context, core})

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.BUILDER_CI_GCP_KEY }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-builder
          args: --accept-dns=false
          hostname: deploy-builder-${{ github.run_id }}-${{ github.run_attempt }}
          log-mode: quiet

      - name: Validate and build exclusively on builder
        env:
          BUILDER_CI_SSH_KEY: ${{ secrets.BUILDER_CI_SSH_KEY }}
        run: |
          export BUILDER_SSH_KEY="$RUNNER_TEMP/builder-ci-key"
          umask 077
          printf '%s\n' "$BUILDER_CI_SSH_KEY" > "$BUILDER_SSH_KEY"
          # on-builder.sh fails on unavailability; there is no local fallback.
          bash scripts/on-builder.sh nix shell --inputs-from . nixpkgs#git nixpkgs#jq nixpkgs#zstd \
            -c bash scripts/deploy-homeserver-build.sh | tee "$RUNNER_TEMP/builder.log"
          bundle=$(sed -n 's/^DEPLOY_BUNDLE=//p' "$RUNNER_TEMP/builder.log")
          [[ $bundle =~ ^/home/user/deploy-bundles/bundle\.[a-zA-Z0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/deploy-bundle"
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i "$BUILDER_SSH_KEY" \
            "user@$BUILDER_FQDN:$bundle/bundle.json" \
            "user@$BUILDER_FQDN:$bundle/closure.nar.zst" "$RUNNER_TEMP/deploy-bundle/"
          ssh -o BatchMode=yes -i "$BUILDER_SSH_KEY" "user@$BUILDER_FQDN" "rm -rf '$bundle'"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homeserver-closure-${{ github.sha }}
          path: ${{ runner.temp }}/deploy-bundle/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Remove temporary builder key
        if: always()
        run: rm -f "$RUNNER_TEMP/builder-ci-key"

  deploy:
    needs: builder
    runs-on: ubuntu-latest
    environment: homeserver-gcp-deploy
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
      - uses: ./.github/actions/setup-nix
        with:
          extra-nix-config: |
            max-jobs = 0
            builders =
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: homeserver-closure-${{ github.sha }}
          path: ${{ runner.temp }}/deploy-bundle
      - name: Import prebuilt closure and deployment client
        run: zstd -d --stdout "$RUNNER_TEMP/deploy-bundle/closure.nar.zst" | nix-store --import >/dev/null
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_DEPLOY_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_DEPLOY_SECRET }}
          tags: tag:ci
          args: --accept-dns=false
          hostname: deploy-homeserver-${{ github.run_id }}-${{ github.run_attempt }}
          log-mode: quiet
      - name: Require PR merge-gate and current main again before activation
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: await require('./scripts/check-deploy-merge-gate.cjs')({github, context, core})
      - name: Configure deploy SSH
        env:
          HOMESERVER_DEPLOY_SSH_KEY: ${{ secrets.HOMESERVER_DEPLOY_SSH_KEY }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$HOMESERVER_DEPLOY_SSH_KEY" > "$HOME/.ssh/homeserver-deploy"
          host=$(jq -er '.deploy.nodes["homeserver-gcp"].hostname' "$RUNNER_TEMP/deploy-bundle/bundle.json")
          # Resolve from the tailnet map; tag:ci has SSH but no DNS-server access.
          # The map's names end with a dot, and `tailscale ip` tries DNS without one.
          address=$(tailscale status --json | jq -er --arg name "$host." 'first(.Peer[] | select(.DNSName == $name) | .TailscaleIPs[0])')
          [[ $address =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'Host homeserver-gcp*\n  HostName %s\n' "$address" >> "$HOME/.ssh/config"
          printf '%s\n' '  IdentityFile ~/.ssh/homeserver-deploy' '  IdentitiesOnly yes' '  BatchMode yes' '  StrictHostKeyChecking accept-new' >> "$HOME/.ssh/config"
      - name: Deploy changed closure and verify health
        run: bash scripts/deploy-homeserver.sh "$RUNNER_TEMP/deploy-bundle"
      - name: Remove temporary deploy key
        if: always()
        run: rm -f "$HOME/.ssh/homeserver-deploy"
